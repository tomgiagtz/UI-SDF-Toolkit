[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdf-toolkit"
version = "0.1.0"
description = "2D SDF generation from raster images for game engine UI textures"
requires-python = ">=3.11"

dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "click>=8.1",
    "imageio>=2.31",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6",
    "PyQt6-Qt6>=6.6",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
sdf-toolkit = "sdf_toolkit.cli:main"

[project.gui-scripts]
sdf-toolkit-gui = "sdf_toolkit_gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdf_toolkit", "src/sdf_toolkit_gui"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true